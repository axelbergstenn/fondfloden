name: Uppdatera data och publicera

on:
  schedule:
    # Varje dag 05:00 UTC (insynshandel uppdateras dagligen, fonddata kvartalsvis)
    - cron: "0 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bygg om alla kvartal"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub stänger av schemalagda körningar i publika repon efter 60 dagar utan aktivitet.
  # Att aktivera arbetsflödet på nytt varje vecka nollställer den räknaren.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Håll det schemalagda arbetsflödet aktivt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # FI:s zip-filer sparas mellan körningar så att bara nya kvartal laddas ner
      - uses: actions/cache@v4
        with:
          path: .cache
          key: fi-zips-${{ github.run_id }}
          restore-keys: fi-zips-

      # pdftotext läser målbolag, pris och premie ur erbjudandehandlingarna
      - name: Installera pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Hämta fondinnehav från FI
        shell: pwsh
        run: |
          $force = "${{ inputs.force }}" -eq "true"
          ./scripts/build-data.ps1 -History 4 -Force:$force

      # Blankning byggs varje gång men sparas inte i repot (den ändras dagligen)
      - name: Hämta blankning från FI
        shell: pwsh
        continue-on-error: true
        run: ./scripts/build-shorts.ps1

      - name: Skapa utkast till nyhetsbrev vid nytt kvartal
        shell: pwsh
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: ./scripts/newsletter.ps1

      - name: Spara ny data i repot
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Uppdatera fondinnehav från FI"
            git push
          else
            echo "Ingen ny data."
          fi

      # Unik version i länkarna till CSS/JS så att webbläsare hämtar nya filer direkt
      - name: Sätt versionsnummer på filerna
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i "s/__VERSION__/$v/g" site/index.html site/assets/app.js
          echo "$v" > site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
