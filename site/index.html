<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fondinsyn</title>
  <meta name="description" content="Insyn i svenska fonder: vilka aktier de köper och säljer, vad de kostar, hur lika de är och vilka bolag de ägde när uppköpsbud kom. Baserat på Finansinspektionens öppna data.">
  <meta property="og:title" content="Fondinsyn">
  <meta property="og:description" content="Insyn i svenska fonder: köp och sälj, avgifter, överlapp och uppköp. Baserat på Finansinspektionens öppna data.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6feb'/%3E%3Crect x='3' y='8' width='2' height='5' fill='%23fff'/%3E%3Crect x='7' y='5' width='2' height='8' fill='%23fff'/%3E%3Crect x='11' y='3' width='2' height='10' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css?v=__VERSION__">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/">
        <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="currentColor"/><rect x="3" y="8" width="2" height="5" fill="var(--bg)"/><rect x="7" y="5" width="2" height="8" fill="var(--bg)"/><rect x="11" y="3" width="2" height="10" fill="var(--bg)"/></svg>
        Fondinsyn
      </a>
      <nav class="mainnav" aria-label="Huvudmeny">
        <a href="#/" data-nav="oversikt">Översikt</a>
        <a href="#/aktier" data-nav="aktier">Aktier</a>
        <a href="#/fonder" data-nav="fonder">Fonder</a>
        <a href="#/forvaltare" data-nav="forvaltare">Förvaltare</a>
        <a href="#/avgifter" data-nav="avgifter">Avgifter</a>
        <a href="#/uppkop" data-nav="uppkop">Uppköp</a>
        <a href="#/portfolj" data-nav="portfolj">Min portfölj</a>
        <a href="#/jamfor" data-nav="jamfor">Jämför</a>
        <a href="#/kontakt" data-nav="kontakt">Kontakt</a>
      </nav>
      <div class="topbar-right">
        <button type="button" class="search-btn" id="searchBtn" aria-label="Sök aktie eller fond (Ctrl K)">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="search-btn-text">Sök</span><kbd>Ctrl K</kbd>
        </button>
        <label class="visually-hidden" for="quarter">Kvartal</label>
        <select id="quarter" class="select-sm" disabled><option>Laddar…</option></select>
      </div>
    </div>
  </header>

  <div class="subbar">
    <div class="container subbar-inner">
      <p id="summary" class="summary">Laddar data…</p>
      <div class="subbar-controls">
        <div class="seg" id="marketSwitch" role="group" aria-label="Marknad">
          <button type="button" class="seg-btn" data-market="se" aria-pressed="true">Sverige</button>
          <button type="button" class="seg-btn" data-market="world" aria-pressed="false">Utland</button>
        </div>
        <label class="check"><input type="checkbox" id="excludeIndex"> Exkludera indexfonder</label>
      </div>
    </div>
  </div>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="container footer">
    <span>Källa: <a href="https://www.fi.se/sv/vara-register/fondinnehav-per-kvartal/" rel="noopener" target="_blank">Finansinspektionen</a></span>
    <span id="updated"></span>
    <a href="#/om">Om datan och metoden</a>
    <a href="#/kontakt">Kontakt</a>
    <span>Inte investeringsrådgivning.</span>
  </footer>

  <div class="search-modal" id="searchModal" hidden>
    <div class="search-backdrop" data-search-close></div>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Sök">
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="searchInput" class="search-input" type="search" placeholder="Sök aktie, ISIN eller fond" autocomplete="off" aria-controls="searchResults">
        <button type="button" class="search-close" data-search-close aria-label="Stäng">Esc</button>
      </div>
      <ul id="searchResults" class="search-results" role="listbox"></ul>
      <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> välj</span><span><kbd>Enter</kbd> öppna</span><span><kbd>Esc</kbd> stäng</span></div>
    </div>
  </div>

  <script src="assets/charts.js?v=__VERSION__"></script>
  <script src="assets/app.js?v=__VERSION__"></script>
</body>
</html>
